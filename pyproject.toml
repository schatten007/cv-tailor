[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "."]
addopts = "--cov=careerkit --cov=tools.install --cov-report=term-missing --cov-fail-under=90"

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["careerkit", "tools"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["scripts", "tools"]

[[tool.mypy.overrides]]
module = ["reportlab.*", "yaml"]
ignore_missing_imports = true
